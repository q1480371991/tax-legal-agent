<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="expert-collaboration-title expert-collaboration-desc"><title id="expert-collaboration-title">按问题组织专家协作</title><desc id="expert-collaboration-desc">实线：主要协作路径 · 虚线：可选分支 / 交互反馈 · 质量审查按开关与任务启用</desc><defs><marker id="expert-collaboration-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#174EA6" stroke-width="2" stroke-linejoin="round"/></marker></defs><style>text{font-family:Bahnschrift,"Microsoft YaHei UI","Microsoft YaHei",sans-serif;} text{font-variant-numeric:tabular-nums;}</style><rect width="1920" height="1080" fill="white"/><text x="80" y="80" font-size="22" font-weight="600" fill="#174EA6" text-anchor="start">MULTI-AGENT COLLABORATION</text><text x="80" y="170" font-size="68" font-weight="600" fill="#18385D" text-anchor="start">按问题组织专家协作</text><text x="80" y="232" font-size="28" font-weight="400" fill="#60758E" text-anchor="start">意图分流、前置检索、按需并行，以及携审查意见的定向重做。</text><path d="M80,269 L1840,269" fill="none" stroke="#CCD7E4" stroke-width="2"/><rect x="80" y="409" width="260" height="151" rx="8" fill="#18385D" stroke="#18385D" stroke-width="2"/><text x="108" y="461" font-size="34" font-weight="600" fill="#FFFFFF" text-anchor="start">用户输入</text><text x="108" y="508" font-size="27" font-weight="400" fill="#DDE8F7" text-anchor="start">问题 / 补充信息</text><rect x="400" y="409" width="305" height="151" rx="8" fill="#FFFFFF" stroke="#CCD7E4" stroke-width="2"/><text x="428" y="461" font-size="34" font-weight="600" fill="#18385D" text-anchor="start">意图判断</text><text x="428" y="508" font-size="27" font-weight="400" fill="#60758E" text-anchor="start">策略 · 专家需求</text><text x="428" y="545" font-size="27" font-weight="400" fill="#60758E" text-anchor="start">澄清需求</text><rect x="770" y="409" width="310" height="151" rx="8" fill="#FFFFFF" stroke="#CCD7E4" stroke-width="2"/><text x="798" y="461" font-size="34" font-weight="600" fill="#18385D" text-anchor="start">前置证据</text><text x="798" y="508" font-size="27" font-weight="400" fill="#60758E" text-anchor="start">实体路径 / RAG</text><text x="798" y="545" font-size="27" font-weight="400" fill="#60758E" text-anchor="start">按输入类型跳过</text><polyline points="340,484 394,484" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#expert-collaboration-arrow)"/><polyline points="705,484 764,484" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#expert-collaboration-arrow)"/><polyline points="1080,484 1144,484" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#expert-collaboration-arrow)"/><rect x="1150" y="355" width="640" height="245" rx="8" fill="#F3F7FC" stroke="#CCD7E4" stroke-width="2"/><text x="1180" y="409" font-size="33" font-weight="600" fill="#18385D" text-anchor="start">领域专家 · 单个或按需并行</text><rect x="1180" y="448" width="185" height="100" rx="6" fill="#FFFFFF" stroke="#CCD7E4" stroke-width="2"/><text x="1272.5" y="508" font-size="36" font-weight="600" fill="#18385D" text-anchor="middle">财务</text><rect x="1375" y="448" width="185" height="100" rx="6" fill="#FFFFFF" stroke="#CCD7E4" stroke-width="2"/><text x="1467.5" y="508" font-size="36" font-weight="600" fill="#18385D" text-anchor="middle">税务</text><rect x="1570" y="448" width="185" height="100" rx="6" fill="#FFFFFF" stroke="#CCD7E4" stroke-width="2"/><text x="1662.5" y="508" font-size="36" font-weight="600" fill="#18385D" text-anchor="middle">法务</text><rect x="1150" y="750" width="310" height="166" rx="8" fill="#FFFFFF" stroke="#CCD7E4" stroke-width="2"/><text x="1178" y="802" font-size="34" font-weight="600" fill="#18385D" text-anchor="start">质量审查</text><text x="1178" y="849" font-size="23" font-weight="400" fill="#60758E" text-anchor="start">开关启用且任务适用</text><text x="1178" y="886" font-size="23" font-weight="400" fill="#60758E" text-anchor="start">问题与建议 / Reflection</text><rect x="670" y="750" width="360" height="166" rx="8" fill="#18385D" stroke="#18385D" stroke-width="2"/><text x="698" y="802" font-size="34" font-weight="600" fill="#FFFFFF" text-anchor="start">最终输出</text><text x="698" y="849" font-size="27" font-weight="400" fill="#DDE8F7" text-anchor="start">回答 / 合成 / 澄清</text><text x="698" y="886" font-size="27" font-weight="400" fill="#DDE8F7" text-anchor="start">SSE 与会话保存</text><polyline points="1470,600 1470,655 1305,655 1305,744" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#expert-collaboration-arrow)"/><polyline points="1150,833 1036,833" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#expert-collaboration-arrow)"/><text x="1087" y="710" font-size="23" font-weight="400" fill="#60758E" text-anchor="middle">合格 / 达到上限</text><polyline points="1460,833 1840,833 1840,485 1796,485" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#expert-collaboration-arrow)"/><text x="1620" y="693" font-size="27" font-weight="600" fill="#174EA6" text-anchor="middle">携审查意见重做</text><text x="1620" y="734" font-size="23" font-weight="400" fill="#60758E" text-anchor="middle">回到实际执行的专家</text><text x="1620" y="771" font-size="23" font-weight="400" fill="#60758E" text-anchor="middle">默认最多重试 3 次</text><polyline points="1180,600 1180,629 970,629 970,744" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#expert-collaboration-arrow)"/><text x="1088" y="614" font-size="23" font-weight="400" fill="#60758E" text-anchor="middle">跳过审查</text><polyline points="925,560 925,744" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#expert-collaboration-arrow)"/><text x="888" y="672" font-size="23" font-weight="400" fill="#60758E" text-anchor="end">直接回答 / 纯 RAG</text><rect x="400" y="750" width="210" height="166" rx="8" fill="#F3F7FC" stroke="#CCD7E4" stroke-width="2"/><text x="428" y="802" font-size="29" font-weight="600" fill="#18385D" text-anchor="start">澄清卡片</text><text x="428" y="849" font-size="22" font-weight="400" fill="#60758E" text-anchor="start">信息不足时追问</text><text x="428" y="886" font-size="22" font-weight="400" fill="#60758E" text-anchor="start">补充后继续</text><polyline points="520,560 520,744" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#expert-collaboration-arrow)"/><polyline points="400,833 368,833 368,538 394,538" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#expert-collaboration-arrow)"/><path d="M80,989 L1840,989" fill="none" stroke="#CCD7E4" stroke-width="2"/><text x="80" y="1033" font-size="24" font-weight="400" fill="#60758E" text-anchor="start">实线：主要协作路径 · 虚线：可选分支 / 交互反馈 · 质量审查按开关与任务启用</text></svg>