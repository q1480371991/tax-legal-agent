<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="cascade-retrieval-title cascade-retrieval-desc"><title id="cascade-retrieval-title">以文本为起点，让图谱补充证据</title><desc id="cascade-retrieval-desc">图谱按需开启 · 扩展失败保留文本检索 · 图谱返回的原文块参与共同排序</desc><defs><marker id="cascade-retrieval-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#174EA6" stroke-width="2" stroke-linejoin="round"/></marker></defs><style>text{font-family:Bahnschrift,"Microsoft YaHei UI","Microsoft YaHei",sans-serif;} text{font-variant-numeric:tabular-nums;}</style><rect width="1920" height="1080" fill="white"/><text x="80" y="80" font-size="22" font-weight="600" fill="#174EA6" text-anchor="start">CASCADE GRAPH RETRIEVAL</text><text x="80" y="170" font-size="68" font-weight="600" fill="#18385D" text-anchor="start">以文本为起点，让图谱补充证据</text><text x="80" y="232" font-size="28" font-weight="400" fill="#60758E" text-anchor="start">两阶段级联：文本召回定位相关内容，实体关系带回更多原文块。</text><path d="M80,269 L1840,269" fill="none" stroke="#CCD7E4" stroke-width="2"/><text x="490" y="319" font-size="27" font-weight="600" fill="#174EA6" text-anchor="start">第一阶段 / 文本召回</text><text x="1390" y="319" font-size="27" font-weight="600" fill="#174EA6" text-anchor="start">第二阶段 / 图谱扩展</text><rect x="80" y="401" width="320" height="166" rx="8" fill="#18385D" stroke="#18385D" stroke-width="2"/><text x="108" y="453" font-size="34" font-weight="600" fill="#FFFFFF" text-anchor="start">用户查询</text><text x="108" y="500" font-size="27" font-weight="400" fill="#DDE8F7" text-anchor="start">领域与过滤条件解析</text><rect x="490" y="354" width="320" height="136" rx="8" fill="#F3F7FC" stroke="#CCD7E4" stroke-width="2"/><text x="518" y="406" font-size="34" font-weight="600" fill="#18385D" text-anchor="start">语义召回</text><text x="518" y="453" font-size="27" font-weight="400" fill="#60758E" text-anchor="start">Dense / 