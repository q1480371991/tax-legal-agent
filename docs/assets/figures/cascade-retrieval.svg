linejoin="round" stroke-linecap="round"  marker-end="url(#cascade-retrieval-arrow)"/><rect x="470" y="745" width="340" height="180" rx="8" fill="#FFFFFF" stroke="#CCD7E4" stroke-width="2"/><text x="498" y="797" font-size="34" font-weight="600" fill="#18385D" text-anchor="start">精排与裁剪</text><text x="498" y="844" font-size="27" font-weight="400" fill="#60758E" text-anchor="start">Rerank / MMR</text><text x="498" y="881" font-size="27" font-weight="400" fill="#60758E" text-anchor="start">Cliff Prune</text><polyline points="900,835 816,835" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#cascade-retrieval-arrow)"/><rect x="80" y="745" width="300" height="180" rx="8" fill="#18385D" stroke="#18385D" stroke-width="2"/><text x="108" y="797" font-size="34" font-weight="600" fill="#FFFFFF" text-anchor="start">证据上下文</text><text x="108" y="844" font-size="27" font-weight="400" fill="#DDE8F7" text-anchor="start">关系展开与去重</text><text x="108" y="881" font-size="27" font-weight="400" fill="#DDE8F7" text-anchor="start">领域组装</text><polyline points="470,835 386,835" fill="none" stroke="#174EA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#cascade-retrieval-arrow)"/><path d="M80,989 L1840,989" fill="none" stroke="#CCD7E4" stroke-width="2"/><text x="80" y="1033" font-size="24" font-weight="400" fill="#60758E" text-anchor="start">图谱按需开启 · 扩展失败保留文本检索 · 图谱返回的原文块参与共同排序</text></svg>